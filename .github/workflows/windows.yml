name: Windows test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release when a version tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg (used by the tests and by HERO TV)
        run: choco install ffmpeg -y --no-progress

      - name: Install the time-zone database (Windows Python has none built in)
        run: python -m pip install tzdata

      - name: Install checking tools (a standard UPnP client, and a QR code reader)
        run: python -m pip install async-upnp-client aiohttp opencv-python-headless numpy

      - name: Run all tests on real Windows
        run: python scripts/ci_tests.py

      - name: Build HERO-TV.exe
        run: |
          python -m pip install --upgrade pyinstaller certifi
          python -m PyInstaller --noconfirm --clean --onedir --name HERO-TV --icon assets\hero-tv.ico --collect-submodules herotv --collect-data tzdata --hidden-import tzdata --collect-data certifi --hidden-import certifi app_entry.py

      - name: Put the app together (exe + program files, ready to unzip)
        shell: pwsh
        run: |
          $pkg = "package\HERO TV"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse dist\HERO-TV\* $pkg
          foreach ($item in "herotv","web","config","assets","scripts","roku","app_entry.py","README.md","README_WINDOWS.txt","requirements-optional.txt") {
            Copy-Item -Recurse $item $pkg
          }
          Copy-Item *.bat $pkg
          New-Item -ItemType Directory -Force "$pkg\data" | Out-Null
          python -c "from herotv import updater; print(updater.write_stamp(r'$pkg'))"

      - name: Smoke test the built app (start it, ask it questions, stop it)
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Smoke test::$_"; exit 1 }
          $pkg = Resolve-Path "package\HERO TV"
          & "$pkg\HERO-TV.exe" doctor
          Write-Host "doctor exit code: $LASTEXITCODE (problems with the empty test PC are fine here)"
          $global:LASTEXITCODE = 0
          $env:HEROTV_MEDIA = "$env:RUNNER_TEMP\media"; New-Item -ItemType Directory -Force $env:HEROTV_MEDIA | Out-Null
          $env:HEROTV_DB = "$env:RUNNER_TEMP\smoke.sqlite3"
          $env:HEROTV_PORT = "8799"
          $p = Start-Process -FilePath "$pkg\HERO-TV.exe" -ArgumentList "serve","--scan" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $h = Invoke-RestMethod http://127.0.0.1:8799/api/health; $ok = $true; break } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "the built app did not answer" }
          Write-Host "health: $($h | ConvertTo-Json -Compress)"
          if (-not $h.frozen) { throw "not running as the built exe" }
          $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          if ($page.Content -notmatch "app.js") { throw "the TV page was not served" }
          $js = Invoke-WebRequest http://127.0.0.1:8799/app.js -UseBasicParsing
          if ($js.Content -notmatch "NEED_API") { throw "the TV page's script was not served" }
          Invoke-RestMethod http://127.0.0.1:8799/api/settings | Out-Null
          Invoke-RestMethod http://127.0.0.1:8799/api/channels-config | Out-Null
          # --- other devices on the network: off by default, then paired, then watch-only ---
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          Write-Host "This runner's network address: $ip"
          $off = $false; try { Invoke-WebRequest "http://${ip}:8800/pair" -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { $off = $true }
          if (-not $off) { throw "the network port answered while switched off" }
          $j = Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"enable"}'
          if (-not $j.running) { throw "could not switch on other devices" }
          $code = 0; try { Invoke-WebRequest "http://${ip}:8800/api/channels" -UseBasicParsing | Out-Null } catch { $code = $_.Exception.Response.StatusCode.value__ }
          if ($code -ne 401) { throw "unpaired device was not refused ($code)" }
          $j = Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"pair"}'
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-RestMethod "http://${ip}:8800/api/pair" -Method Post -ContentType 'application/json' -Body ("{""code"":""" + $j.pairing.code + """}") -WebSession $s | Out-Null
          $ch = Invoke-RestMethod "http://${ip}:8800/api/channels" -WebSession $s
          Write-Host "Paired device sees $($ch.channels.Count) channels"
          $code = 0; try { Invoke-WebRequest "http://${ip}:8800/api/settings" -UseBasicParsing -WebSession $s | Out-Null } catch { $code = $_.Exception.Response.StatusCode.value__ }
          if ($code -ne 403) { throw "paired device could read settings ($code)" }
          # --- "Phone can't connect?": read the real Windows firewall/network type, then let the fix run as admin ---
          $chk = Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"check"}'
          Write-Host "connection check: $($chk.check | ConvertTo-Json -Compress -Depth 4)"
          if (-not $chk.check.windows) { throw "the connection check could not read Windows' firewall and network settings" }
          if (-not $chk.check.alias) { throw "the connection check did not find the network card of $($chk.check.addresses[0])" }
          $fixable = @($chk.check.problems | Where-Object { $_.fixable }).Count
          if ($fixable -gt 0) {
            Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"fix-network"}' | Out-Null
            Start-Sleep -Seconds 10
            $chk = Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"check"}'
            Write-Host "after the fix: $($chk.check | ConvertTo-Json -Compress -Depth 4)"
            if (@($chk.check.problems | Where-Object { $_.fixable }).Count -gt 0) { throw "the fix did not clear: $(($chk.check.problems | ForEach-Object { $_.id }) -join ', ')" }
          }
          if (-not (Get-NetFirewallRule -DisplayName 'HERO TV (home network)' -ErrorAction SilentlyContinue) -and $fixable -gt 0) { throw "no firewall rule was made" }
          Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"disable"}' | Out-Null
          Write-Host "Other-devices test passed."
          # --- TV media players (DLNA): off by default, then browsable over the network ---
          $off = $false; try { Invoke-WebRequest "http://${ip}:8801/dlna/description.xml" -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { $off = $true }
          if (-not $off) { throw "the TV media server answered while switched off" }
          Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"dlna-on"}' | Out-Null
          $desc = Invoke-WebRequest "http://${ip}:8801/dlna/description.xml" -UseBasicParsing
          if ($desc.Content -notmatch "MediaServer:1") { throw "no media server description" }
          $soap = '<?xml version="1.0"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><u:Browse xmlns:u="urn:schemas-upnp-org:service:ContentDirectory:1"><ObjectID>0</ObjectID><BrowseFlag>BrowseDirectChildren</BrowseFlag><Filter>*</Filter><StartingIndex>0</StartingIndex><RequestedCount>0</RequestedCount><SortCriteria></SortCriteria></u:Browse></s:Body></s:Envelope>'
          $r = Invoke-WebRequest "http://${ip}:8801/dlna/control/cds" -Method Post -Body $soap -ContentType 'text/xml; charset=utf-8' -Headers @{ SOAPACTION = '"urn:schemas-upnp-org:service:ContentDirectory:1#Browse"' } -UseBasicParsing
          if ($r.Content -notmatch "TotalMatches") { throw "Browse did not answer properly" }
          Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"dlna-off"}' | Out-Null
          Write-Host "TV media server test passed."
          # --- always on: the Startup-folder shortcut is made and removed for real ---
          $a = Invoke-RestMethod http://127.0.0.1:8799/api/alwayson -Method Post -ContentType 'application/json' -Body '{"startup":true}'
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'HERO TV.lnk'
          if (-not $a.startup -or -not (Test-Path $lnk)) { throw "Start with Windows did not make $lnk" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($sc.Arguments -notmatch '--no-browser' -or $sc.TargetPath -notmatch 'HERO-TV.exe') { throw "wrong startup shortcut: $($sc.TargetPath) $($sc.Arguments)" }
          if (-not $a.background) { throw "starting with Windows must also keep HERO TV running" }
          $a = Invoke-RestMethod http://127.0.0.1:8799/api/alwayson -Method Post -ContentType 'application/json' -Body '{"startup":false}'
          if ($a.startup -or (Test-Path $lnk)) { throw "the startup shortcut was not removed" }
          Write-Host "Always-on test passed."
          Invoke-RestMethod http://127.0.0.1:8799/api/quit -Method Post -ContentType 'application/json' -Body '{}' | Out-Null
          $gone = $false
          for ($i = 0; $i -lt 20; $i++) { Start-Sleep -Milliseconds 500; try { Invoke-RestMethod http://127.0.0.1:8799/api/health -TimeoutSec 2 | Out-Null } catch { $gone = $true; break } }
          if (-not $gone) { throw "Quit HERO TV did not turn it off" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed."

      - name: Test updating an older copy with this build (exe swaps itself)
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Update test::$_"; exit 1 }
          $new = Resolve-Path "package\HERO TV"
          Compress-Archive -Path $new -DestinationPath "$env:RUNNER_TEMP\HERO-TV-test-windows.zip"
          $old = "$env:RUNNER_TEMP\old\HERO TV"
          New-Item -ItemType Directory -Force (Split-Path $old) | Out-Null
          Copy-Item -Recurse $new $old
          Set-Content "$old\app-build.txt" "old-build"
          $env:HEROTV_UPDATE_NO_START = "1"
          & "$old\HERO-TV.exe" update "$env:RUNNER_TEMP\HERO-TV-test-windows.zip" --yes
          $want = Get-Content "$new\app-build.txt"
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Get-Content "$old\app-build.txt") -eq $want) { break }
          }
          if ((Get-Content "$old\app-build.txt") -ne $want) { throw "the update did not swap in the new application" }
          if ((Get-FileHash "$old\HERO-TV.exe").Hash -ne (Get-FileHash "$new\HERO-TV.exe").Hash) { throw "exe differs after update" }
          & "$old\HERO-TV.exe" doctor | Out-Null       # starts and checks itself; ffmpeg may be missing on the runner
          $global:LASTEXITCODE = 0
          Write-Host "Update test passed."

      - name: Test the one-press update (running HERO TV closes, swaps itself, starts again)
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\HeroTV\update.log"
          trap { $t = ""; if (Test-Path $log) { $t = ((Get-Content $log | Select-Object -Last 15) -join " | ") }; Write-Output "::error title=One-press update::$_ LOG: $t"; Get-Process HERO-TV -ErrorAction SilentlyContinue | Stop-Process -Force; exit 1 }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {      # HERO TV only starts with its video tools
            choco install ffmpeg -y --no-progress | Out-Null
            $env:PATH = "$env:ProgramData\chocolatey\bin;$env:PATH"
          }
          $new = Resolve-Path "package\HERO TV"
          $old = "$env:RUNNER_TEMP\old2\HERO TV"
          New-Item -ItemType Directory -Force (Split-Path $old) | Out-Null
          Copy-Item -Recurse $new $old
          Set-Content "$old\app-build.txt" "old-build"
          $env:HEROTV_MEDIA = "$env:RUNNER_TEMP\media2"; New-Item -ItemType Directory -Force $env:HEROTV_MEDIA | Out-Null
          $env:HEROTV_DB = "$env:RUNNER_TEMP\upd.sqlite3"
          $env:HEROTV_PORT = "8797"
          $env:HEROTV_NO_UPDATE_CHECK = "1"
          Start-Process -FilePath "$old\HERO-TV.exe" -ArgumentList "serve" -NoNewWindow | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep -Seconds 1; try { Invoke-RestMethod http://127.0.0.1:8797/api/health | Out-Null; $ok = $true; break } catch {} }
          if (-not $ok) { throw "the old copy did not start" }
          $u = Invoke-RestMethod http://127.0.0.1:8797/api/update
          Write-Host "update status: $($u | ConvertTo-Json -Compress)"
          if (-not $u.can_install) { throw "the built app says it cannot install updates" }
          $env:HEROTV_RESTART_NO_BROWSER = "1"
          Start-Process -FilePath "$old\HERO-TV.exe" -ArgumentList "self-update","`"$env:RUNNER_TEMP\HERO-TV-test-windows.zip`"" | Out-Null
          $want = Get-Content "$new\app-build.txt"
          for ($i = 0; $i -lt 120; $i++) { Start-Sleep -Seconds 1; if ((Get-Content "$old\app-build.txt") -eq $want) { break } }
          if ((Get-Content "$old\app-build.txt") -ne $want) { throw "the new application was not swapped in" }
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) { Start-Sleep -Seconds 1; try { $h = Invoke-RestMethod http://127.0.0.1:8797/api/health; $ok = $true; break } catch {} }
          if (-not $ok) { throw "HERO TV did not start again after updating" }
          if (-not $h.frozen) { throw "the restarted HERO TV is not the built app" }
          Get-Process HERO-TV -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "One-press update test passed: closed, swapped and started again by itself."

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Installer build::$_"; exit 1 }
          choco install innosetup -y --no-progress | Out-Null
          $v = python -c "import herotv; print(herotv.__version__)"
          $out = & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\hero-tv.iss 2>&1
          if ($LASTEXITCODE -ne 0) { throw ("ISCC failed ($LASTEXITCODE): " + (($out | Select-Object -Last 12) -join " | ")) }
          Get-ChildItem installer-out

      - name: Test the installer (install, upgrade keeping your channels, uninstall)
        shell: pwsh
        run: |
          trap { Write-Output "::error title=Installer test::$_"; exit 1 }
          $setup = (Get-ChildItem installer-out\HERO-TV-Setup-*.exe).FullName
          $dir = "$env:RUNNER_TEMP\inst\HERO TV"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed ($($p.ExitCode))" }
          foreach ($f in "HERO-TV.exe","_internal","web\app.js","config\channels.json","Update-HERO-TV.bat","app-build.txt") {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\HERO TV\HERO TV.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\HERO TV.lnk")) { throw "no desktop shortcut" }
          & "$dir\HERO-TV.exe" doctor | Out-Null
          $global:LASTEXITCODE = 0
          Set-Content "$dir\config\channels.json" '{"channels": [{"id": "mine", "number": 1, "name": "Mine", "match": {}}]}'
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "re-install failed ($($p.ExitCode))" }
          if ((Get-Content "$dir\config\channels.json" -Raw) -notmatch '"Mine"') { throw "re-installing replaced the user's channels" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\HERO-TV.exe") { throw "uninstall left the program behind" }
          if (Test-Path $lnk) { throw "uninstall left the Start menu shortcut" }
          if ((Get-Content "$dir\config\channels.json" -Raw) -notmatch '"Mine"') { throw "uninstall deleted the user's channels" }
          Write-Host "Installer test passed."

      - name: Upload the installer
        uses: actions/upload-artifact@v5
        with:
          name: HERO-TV-installer
          path: installer-out/*.exe
          retention-days: 30

      - name: Phone test in Chrome's engine on Windows
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python scripts/browser_phone_test.py chromium
          python scripts/browser_pc_test.py chromium

      - name: Upload the finished app
        uses: actions/upload-artifact@v5
        with:
          name: HERO-TV-windows
          path: package
          retention-days: 30


  safari-engine:
    # Safari's engine (WebKit), the engine of every iPhone browser. Runs on Linux: GitHub's Mac machines are often
    # queued for a long time, and a release should not wait on them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Safari engine
        run: |
          python -m pip install playwright opencv-python-headless numpy
          python -m playwright install --with-deps webkit
      - name: Phone test (pair, watch, touch, watch-only) in Safari's engine
        run: python scripts/browser_phone_test.py webkit
      - name: Everyday features test (welcome, New, next episode, settings) in Safari's engine
        run: python scripts/browser_pc_test.py webkit
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: safari-screenshots
          path: "*.png"
          retention-days: 14

  roku-app:
    name: Roku TV app (BrightScript compiler and lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Compile the Roku app with the BrightScript compiler
        run: |
          set -o pipefail
          npm i --no-audit --no-fund brighterscript@0.69 @rokucommunity/bslint@0.8 > /dev/null
          cat > bsconfig.json <<'JSON'
          {"rootDir": "roku", "files": ["manifest", "source/**/*", "components/**/*", "images/**/*"],
           "createPackage": false, "diagnosticFilters": [], "plugins": ["@rokucommunity/bslint"]}
          JSON
          cat > bslint.json <<'JSON'
          {"rules": {"inline-if-style": "off", "block-if-style": "off", "condition-style": "off", "named-function-style": "off",
                     "anon-function-style": "off", "aa-comma-style": "off", "case-sensitivity": "off", "unused-variable": "warn",
                     "unreachable-code": "warn", "consistent-return": "error", "assign-all-paths": "error"}}
          JSON
          npx bsc --project bsconfig.json 2>&1 | tee bsc.log
          if grep -E "error|ERROR" bsc.log | grep -v " 0 errors"; then
            grep -E "(error|warning)" bsc.log | head -40 | while read -r l; do echo "::error title=Roku app::$l"; done
            exit 1
          fi
          echo "::notice title=Roku app::compiled without errors - $(grep -v '^\s*$' bsc.log | tail -2 | tr '\n' ' ' | cut -c1-200)"
          # the checker must really catch mistakes: a copy with a broken line has to fail
          rm -rf broken && cp -r roku broken && printf '\nsub oops(\n    x = = 1\nend sub\n' >> broken/components/MainScene.brs
          sed 's#"rootDir": "roku"#"rootDir": "broken"#' bsconfig.json > bsbroken.json
          if npx bsc --project bsbroken.json > broken.log 2>&1 && ! grep -qiE "error" broken.log; then
            echo "::error title=Roku app::the BrightScript check did not notice a broken file"; exit 1
          fi
      - name: Package the Roku app like HERO TV does and check it
        run: |
          python3 -c "
          import io, zipfile, sys
          sys.path.insert(0, '.')
          from herotv import roku
          z = zipfile.ZipFile(io.BytesIO(roku.build_zip('http://192.168.1.2:8788', 'tok', 'mk')))
          n = z.namelist()
          assert 'manifest' in n and 'source/main.brs' in n and 'components/MainScene.xml' in n, n
          print('Roku package:', len(n), 'files,', sum(i.file_size for i in z.infolist()), 'bytes')
          "

  release:
    # Publishes only when BOTH the Windows checks and the Safari-engine checks passed, and the version is new.
    needs: [windows, safari-engine, roku-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Is this a new version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import herotv; print(herotv.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$v is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "v$v is new - publishing"
          fi
      - name: Get the finished app from the Windows job
        if: steps.ver.outputs.new == 'true'
        uses: actions/download-artifact@v5
        with:
          name: HERO-TV-windows
          path: package
      - name: Zip for the release
        if: steps.ver.outputs.new == 'true'
        run: cd package && zip -qr "../HERO-TV-v${{ steps.ver.outputs.version }}-windows.zip" "HERO TV"
      - name: Get the installer from the Windows job
        if: steps.ver.outputs.new == 'true'
        uses: actions/download-artifact@v5
        with:
          name: HERO-TV-installer
          path: installer-out
      - name: Publish the release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HERO TV ${{ steps.ver.outputs.version }}
          files: |
            HERO-TV-v${{ steps.ver.outputs.version }}-windows.zip
            installer-out/HERO-TV-Setup-v${{ steps.ver.outputs.version }}.exe
          body: |
            Already using HERO TV 1.11 or newer: it offers this update by itself - Settings > Backup and about > Install now.
            Older HERO TV: download HERO-TV-v${{ steps.ver.outputs.version }}-windows.zip below, then double-click Update-HERO-TV.bat in your HERO TV folder
            (it finds the zip in your Downloads folder), or run the Setup below over your old install.
            New PC: download HERO-TV-Setup-v${{ steps.ver.outputs.version }}.exe and run it (no administrator rights needed; Windows may say
            "unknown publisher" because it is not code-signed: More info > Run anyway).
            Tested automatically: all unit tests and the built app on Windows, plus a phone test in Safari's engine.
          generate_release_notes: true
