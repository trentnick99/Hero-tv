name: Windows test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release when a version tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ffmpeg (used by the tests and by HERO TV)
        run: choco install ffmpeg -y --no-progress

      - name: Install the time-zone database (Windows Python has none built in)
        run: python -m pip install tzdata

      - name: Run all tests on real Windows
        run: python scripts/ci_tests.py

      - name: Build HERO-TV.exe
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --name HERO-TV --icon assets\hero-tv.ico --collect-submodules herotv --collect-data tzdata --hidden-import tzdata app_entry.py

      - name: Put the app together (exe + program files, ready to unzip)
        shell: pwsh
        run: |
          $pkg = "package\HERO TV"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse dist\HERO-TV\* $pkg
          foreach ($item in "herotv","web","config","assets","scripts","app_entry.py","README.md","README_WINDOWS.txt","requirements-optional.txt") {
            Copy-Item -Recurse $item $pkg
          }
          Copy-Item *.bat $pkg
          New-Item -ItemType Directory -Force "$pkg\data" | Out-Null
          python -c "from herotv import updater; print(updater.write_stamp(r'$pkg'))"

      - name: Smoke test the built app (start it, ask it questions, stop it)
        shell: pwsh
        run: |
          $pkg = Resolve-Path "package\HERO TV"
          & "$pkg\HERO-TV.exe" doctor
          Write-Host "doctor exit code: $LASTEXITCODE (problems with the empty test PC are fine here)"
          $env:HEROTV_MEDIA = "$env:RUNNER_TEMP\media"; New-Item -ItemType Directory -Force $env:HEROTV_MEDIA | Out-Null
          $env:HEROTV_DB = "$env:RUNNER_TEMP\smoke.sqlite3"
          $env:HEROTV_PORT = "8799"
          $p = Start-Process -FilePath "$pkg\HERO-TV.exe" -ArgumentList "serve","--scan" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $h = Invoke-RestMethod http://127.0.0.1:8799/api/health; $ok = $true; break } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "the built app did not answer" }
          Write-Host "health: $($h | ConvertTo-Json -Compress)"
          if (-not $h.frozen) { throw "not running as the built exe" }
          $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          if ($page.Content -notmatch "NEED_API") { throw "the TV page was not served" }
          Invoke-RestMethod http://127.0.0.1:8799/api/settings | Out-Null
          Invoke-RestMethod http://127.0.0.1:8799/api/channels-config | Out-Null
          # --- other devices on the network: off by default, then paired, then watch-only ---
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          Write-Host "This runner's network address: $ip"
          $off = $false; try { Invoke-WebRequest "http://${ip}:8800/pair" -UseBasicParsing -TimeoutSec 5 | Out-Null } catch { $off = $true }
          if (-not $off) { throw "the network port answered while switched off" }
          $j = Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"enable"}'
          if (-not $j.running) { throw "could not switch on other devices" }
          $code = 0; try { Invoke-WebRequest "http://${ip}:8800/api/channels" -UseBasicParsing | Out-Null } catch { $code = $_.Exception.Response.StatusCode.value__ }
          if ($code -ne 401) { throw "unpaired device was not refused ($code)" }
          $j = Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"pair"}'
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-RestMethod "http://${ip}:8800/api/pair" -Method Post -ContentType 'application/json' -Body ("{""code"":""" + $j.pairing.code + """}") -WebSession $s | Out-Null
          $ch = Invoke-RestMethod "http://${ip}:8800/api/channels" -WebSession $s
          Write-Host "Paired device sees $($ch.channels.Count) channels"
          $code = 0; try { Invoke-WebRequest "http://${ip}:8800/api/settings" -UseBasicParsing -WebSession $s | Out-Null } catch { $code = $_.Exception.Response.StatusCode.value__ }
          if ($code -ne 403) { throw "paired device could read settings ($code)" }
          Invoke-RestMethod http://127.0.0.1:8799/api/devices -Method Post -ContentType 'application/json' -Body '{"op":"disable"}' | Out-Null
          Write-Host "Other-devices test passed."
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed."

      - name: Test updating an older copy with this build (exe swaps itself)
        shell: pwsh
        run: |
          $new = Resolve-Path "package\HERO TV"
          Compress-Archive -Path $new -DestinationPath "$env:RUNNER_TEMP\HERO-TV-test-windows.zip"
          $old = "$env:RUNNER_TEMP\old\HERO TV"
          New-Item -ItemType Directory -Force (Split-Path $old) | Out-Null
          Copy-Item -Recurse $new $old
          Set-Content "$old\app-build.txt" "old-build"
          $env:HEROTV_UPDATE_NO_START = "1"
          & "$old\HERO-TV.exe" update "$env:RUNNER_TEMP\HERO-TV-test-windows.zip" --yes
          $want = Get-Content "$new\app-build.txt"
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Get-Content "$old\app-build.txt") -eq $want) { break }
          }
          if ((Get-Content "$old\app-build.txt") -ne $want) { throw "the update did not swap in the new application" }
          if ((Get-FileHash "$old\HERO-TV.exe").Hash -ne (Get-FileHash "$new\HERO-TV.exe").Hash) { throw "exe differs after update" }
          & "$old\HERO-TV.exe" doctor | Out-Null
          Write-Host "Update test passed."

      - name: Phone test in Chrome's engine on Windows
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python scripts/browser_phone_test.py chromium

      - name: Upload the finished app
        uses: actions/upload-artifact@v5
        with:
          name: HERO-TV-windows
          path: package
          retention-days: 30

      - name: Is this a new version? (then publish it as a release)
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import herotv; print(herotv.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v is already released" }
          else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v is new - publishing"; $global:LASTEXITCODE = 0 }

      - name: Zip for the release
        if: steps.ver.outputs.new == 'true'
        shell: pwsh
        run: Compress-Archive -Path "package\HERO TV" -DestinationPath "HERO-TV-v${{ steps.ver.outputs.version }}-windows.zip"

      - name: Publish the release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HERO TV ${{ steps.ver.outputs.version }}
          files: HERO-TV-v${{ steps.ver.outputs.version }}-windows.zip
          body: |
            Download HERO-TV-v${{ steps.ver.outputs.version }}-windows.zip below, then double-click Update-HERO-TV.bat in your HERO TV folder
            (it finds the zip in your Downloads folder). New install: unzip it anywhere and double-click HERO-TV.exe.
          generate_release_notes: true

  safari-engine:
    # Safari's engine (WebKit) on a Mac: the closest thing to an iPhone that runs in the cloud.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the Safari engine
        run: |
          python -m pip install playwright
          python -m playwright install webkit
      - name: Phone test (pair, watch, touch, watch-only) in Safari's engine
        run: python scripts/browser_phone_test.py webkit
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: safari-screenshots
          path: "*.png"
          retention-days: 14
