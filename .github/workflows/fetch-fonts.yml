name: Fetch fonts (one-off)
on:
  push:
    paths: [".github/workflows/fetch-fonts.yml"]
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the open-licence fonts from Google Fonts' GitHub and add them to web/fonts
        run: |
          set -e
          mkdir -p web/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o web/fonts/AtkinsonHyperlegible-Regular.ttf "$base/atkinsonhyperlegible/AtkinsonHyperlegible-Regular.ttf"
          curl -fsSL -o web/fonts/AtkinsonHyperlegible-Bold.ttf "$base/atkinsonhyperlegible/AtkinsonHyperlegible-Bold.ttf"
          curl -fsSL -o web/fonts/OFL-AtkinsonHyperlegible.txt "$base/atkinsonhyperlegible/OFL.txt"
          curl -fsSL -o web/fonts/BarlowCondensed-SemiBold.ttf "$base/barlowcondensed/BarlowCondensed-SemiBold.ttf"
          curl -fsSL -o web/fonts/BarlowCondensed-Bold.ttf "$base/barlowcondensed/BarlowCondensed-Bold.ttf"
          curl -fsSL -o web/fonts/OFL-BarlowCondensed.txt "$base/barlowcondensed/OFL.txt"
          ls -la web/fonts; sha256sum web/fonts/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/fonts
          git commit -m "Add open-licence fonts (Atkinson Hyperlegible, Barlow Condensed; SIL OFL 1.1) from github.com/google/fonts"
          git push
