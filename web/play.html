<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<title>Movie Roulette</title>
<style>
:root{--bg:#07080f;--panel:#151a2b;--line:#2b3352;--text:#f2f0ea;--mute:#a7adbf;--accent:#ffcf1f;--bad:#ff4d6d;--ok:#58d68d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{letter-spacing:.2em;font-size:12px;color:var(--accent)}
header span{font-weight:700;padding:4px 12px;border-radius:99px;border-left:6px solid var(--c,var(--accent));background:var(--panel)}
h1{margin:0;font-size:26px;line-height:1.15}
p{margin:0;color:var(--mute)}
.card{background:var(--panel);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
input{font:inherit;font-size:20px;width:100%;padding:13px 12px;border-radius:12px;border:2px solid var(--line);background:#0b0e1c;color:var(--text)}
input:focus{outline:none;border-color:var(--accent)}
#code{font-size:32px;letter-spacing:.4em;text-align:center;text-transform:uppercase}
button{font:inherit;font-weight:700;font-size:18px;padding:15px 14px;border-radius:12px;border:2px solid transparent;background:var(--accent);color:#111;cursor:pointer;width:100%;text-align:center}
button.opt{background:#0b0e1c;color:var(--text);border-color:var(--line);text-align:left;display:flex;gap:12px;align-items:center}
button.opt i{font-style:normal;font-weight:800;color:var(--accent);min-width:1.2em}
button:disabled{opacity:.5}
#pic{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9;object-fit:contain;display:block}
.msg{min-height:1.4em;font-weight:700}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}.msg.warn{color:var(--accent)}
.hint{border-left:5px solid var(--accent);padding:6px 10px;background:#0b0e1c;border-radius:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;color:var(--mute)}
.top b{color:var(--text);font-size:22px}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#0b0e1c;border-left:6px solid var(--c)}
.sc.me{outline:2px solid var(--accent)}
.sc em{font-style:normal;font-weight:800;font-size:20px}
.ans small{letter-spacing:.2em;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<main id="m"></main>
<script>
(()=>{"use strict";
const m=document.getElementById("m"),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const KEY="heroRoulette";let tok="",S=null,sig="",note={t:"",c:""},draft="",busy=false,poll=0,fails=0;
try{tok=localStorage.getItem(KEY)||""}catch(e){}
async function call(path,body){const r=await fetch("/api/party/"+path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw new Error(j&&j.error?j.error:"Could not reach the TV. Are you on the same WiFi?");return j}
function head(){const h=el("header");h.append(el("b",0,"MOVIE ROULETTE"));if(S){const s=el("span",0,S.side_name===S.name?S.name:S.name+" · "+S.side_name);s.style.setProperty("--c",S.color);h.append(s)}return h}
function joinForm(err,teams,keep){clearInterval(poll);S=null;sig="";m.textContent="";m.append(head());const c=el("div","card");c.append(el("h1",0,"Join the game"),el("p",0,"Type the four letters on the TV and your name."));
 const code=el("input");code.id="code";code.maxLength=4;code.autocomplete="off";code.autocapitalize="characters";code.placeholder="CODE";code.value=keep?keep.code:(new URLSearchParams(location.search).get("c")||"").toUpperCase().slice(0,4);
 const name=el("input");name.maxLength=24;name.placeholder="Your name";name.autocomplete="off";let saved="";try{saved=localStorage.getItem(KEY+"Name")||""}catch(e){}name.value=keep?keep.name:saved;
 const msg=el("div","msg bad",err||"");c.append(code,name);
 const go=async team=>{const body={code:code.value.trim(),name:name.value.trim()};if(team)body.team=team;if(body.code.length<4)return msg.textContent="Type the four letters on the TV.";if(!body.name)return msg.textContent="Type your name.";
  try{const j=await call("join",body);if(j.teams)return joinForm("",j.teams,body);tok=j.token;try{localStorage.setItem(KEY,tok);localStorage.setItem(KEY+"Name",body.name)}catch(e){}start()}catch(e){msg.textContent=String(e.message||e)}};
 if(teams){c.append(el("p",0,"Which team are you on?"));for(const t of teams){const b=el("button","opt",t.name);b.type="button";b.onclick=()=>go(t.id);c.append(b)}}
 else{const b=el("button",0,"Join");b.type="button";b.onclick=()=>go();c.append(b);name.addEventListener("keydown",e=>{if(e.key==="Enter")go()})}
 c.append(msg);m.append(c);(code.value.length<4?code:name).focus()}
function start(){clearInterval(poll);tick();poll=setInterval(tick,1000)}
async function tick(){if(busy)return;try{const j=await call("state?t="+encodeURIComponent(tok));fails=0;S=j;draw()}catch(e){if(/over|code/i.test(String(e.message))){tok="";try{localStorage.removeItem(KEY)}catch(x){}return joinForm(String(e.message))}
  if(++fails>4){note={t:"Lost the TV. Trying again...",c:"bad"};draw(true)}}}
function left(t){if(!t||t.left==null)return null;return Math.max(0,Math.ceil(t.left))}
function draw(force){const typing=document.activeElement&&document.activeElement.tagName==="INPUT";const r=S.round,s=[S.status,r&&r.number,r&&r.status,r&&r.hints.length,r&&r.can,r&&r.out,r&&r.win.side,r&&r.frames.length,S.board.map(b=>b.points).join(","),note.t].join("|");
 if(!force&&s===sig){const tm=document.getElementById("tm");if(tm&&r){const l=left(r.timer);tm.textContent=l==null?"":l+" s"}return}
 sig=s;m.textContent="";m.append(head());
 if(S.status!=="active"){const c=el("div","card");c.append(el("h1",0,S.winners.length?S.winners.join(" & ")+(S.winners.length>1?" tie!":" wins!"):"Game over"),board());const b=el("button",0,"Join another game");b.onclick=()=>{tok="";try{localStorage.removeItem(KEY)}catch(e){}joinForm()};c.append(b);m.append(c);clearInterval(poll);return}
 if(!r){const c=el("div","card");c.append(el("h1",0,"You're in, "+S.name+"!"),el("p",0,"Waiting for the game to start on the TV."),board());m.append(c);return}
 const c=el("div","card"),top=el("div","top");top.append(el("span",0,`Round ${r.number} of ${S.rounds}`));const tm=el("b");tm.id="tm";const l=left(r.timer);tm.textContent=r.status==="guess"&&l!=null?l+" s":"";top.append(tm);c.append(top);
 if(r.frames.length){const im=el("img");im.id="pic";im.alt="A moment from the film";im.src=r.frames[r.frames.length-1]+"?t="+encodeURIComponent(tok);c.append(im)}
 for(const h of r.hints)c.append(el("div","hint",h));
 if(r.status==="pick")c.append(el("p",0,"The moment is being chosen on the TV."));
 else if(r.answer){const a=el("div","ans");a.append(el("small",0,r.status==="skipped"?"IT WAS":"THE FILM IS"),el("h1",0,r.answer.title+(r.answer.year?" ("+r.answer.year+")":"")));c.append(a);
  c.append(el("div","msg "+(r.win.side===S.side?"ok":""),r.status==="skipped"?"Skipped.":r.win.side===S.side?`You got it! +${r.win.points}`:r.won_by?r.won_by+" got it.":"Nobody got it."),el("p",0,"Next round starts on the TV."))}
 else if(S.answers==="host")c.append(el("p",0,"Say your answer out loud. The host decides."));
 else if(r.out)c.append(el("div","msg bad","Not that one. You're out until the next film."));
 else if(!r.my_turn)c.append(el("p",0,`It is ${r.turn}'s turn.`));
 else if(r.can&&r.choices){r.choices.forEach((t,i)=>{const b=el("button","opt");b.type="button";b.append(el("i",0,"ABCD"[i]||""),el("span",0,t));b.onclick=()=>send({choice:i});c.append(b)})}
 else if(r.can){const inp=el("input");inp.placeholder="Name the film";inp.autocomplete="off";inp.autocapitalize="words";inp.value=draft;inp.oninput=()=>{draft=inp.value};inp.addEventListener("keydown",e=>{if(e.key==="Enter")send({text:inp.value})});
  const b=el("button",0,"Guess");b.type="button";b.onclick=()=>send({text:inp.value});c.append(inp,b)}
 if(note.t&&!r.answer)c.append(el("div","msg "+note.c,note.t));
 m.append(c);const sc=el("div","card");sc.append(board());m.append(sc);if(typing){const i=c.querySelector("input");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
function board(){const w=el("div");w.style.cssText="display:flex;flex-direction:column;gap:6px";for(const b of S.board){const r=el("div","sc"+(b.id===S.side?" me":""));r.style.setProperty("--c",b.color);r.append(el("span",0,b.points?(b.tied?"=":"")+b.rank:""),el("b",0,b.name),el("em",0,String(b.points)));w.append(r)}return w}
async function send(body){if(busy)return;if("text"in body&&!String(body.text).trim()){note={t:"Type the film's name first.",c:"warn"};return draw(true)}busy=true;body.token=tok;
 try{const j=await call("answer",body);S=j.state;draft="";note=j.verdict==="correct"?{t:"",c:""}:j.verdict==="close"?{t:"Close! Be more exact.",c:"warn"}:{t:"Not that one.",c:"bad"};if(navigator.vibrate)navigator.vibrate(j.verdict==="correct"?[60,40,120]:80)}
 catch(e){note={t:String(e.message||e),c:"bad"}}finally{busy=false;draw(true);setTimeout(()=>{if(note.c!=="ok"){note={t:"",c:""};if(S)draw(true)}},2500)}}
if(tok)start();else joinForm();
})();
</script>
</body>
</html>
